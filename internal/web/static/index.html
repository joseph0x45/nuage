<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Nuage</title>
  <meta name="theme-color" content="#2f6f4f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Nuage">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <main id="login-view" class="view" hidden>
    <form id="login-form" class="login-card">
      <h1>Nuage</h1>
      <p class="subtitle">Log in to your profile to continue.</p>
      <input type="text" id="login-username" placeholder="Username" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>

  <main id="app-view" class="view" hidden>
    <header class="topbar">
      <h1>Nuage</h1>
      <button id="logout-btn" class="link-btn">Log out</button>
    </header>

    <div id="dropzone" class="dropzone">
      <p>Drag &amp; drop files here, or tap to choose</p>
      <input type="file" id="file-input" multiple hidden>
    </div>

    <ul id="uploads" class="uploads"></ul>

    <ul id="file-list" class="file-list"></ul>
    <p id="empty-state" class="empty-state" hidden>No files yet — drop something above.</p>
  </main>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightbox-close" class="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" alt="">
  </div>

  <script src="/app.js"></script>
</body>
</html>
