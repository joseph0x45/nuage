<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuage</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <main id="login-view" class="view" hidden>
    <form id="login-form" class="login-card">
      <h1>Nuage</h1>
      <p class="subtitle">Enter the password to continue.</p>
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </main>

  <main id="app-view" class="view" hidden>
    <header class="topbar">
      <h1>Nuage</h1>
      <button id="logout-btn" class="link-btn">Log out</button>
    </header>

    <div id="dropzone" class="dropzone">
      <p>Drag &amp; drop files here, or click to choose</p>
      <input type="file" id="file-input" multiple hidden>
    </div>

    <ul id="uploads" class="uploads"></ul>

    <table class="file-table">
      <thead>
        <tr><th>Name</th><th>Size</th><th>Uploaded</th><th></th></tr>
      </thead>
      <tbody id="file-list"></tbody>
    </table>
    <p id="empty-state" class="empty-state" hidden>No files yet — drop something above.</p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
